<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carrossel 6 · linha rica · Paola Rosa</title>
<!-- Uso: carrossel-rico.html?s=1..8  ·  1080x1350
     Mesma linha das artes ricas dos anúncios (03 - criativos/2026-10-12-teste-01/fonte/criativo-rico.html):
     fundo índigo com brilho, título em duas vozes, ícone de linha em círculo, assinatura entre fios. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&family=Inter+Tight:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=block" rel="stylesheet">
<style>
  :root { --ouro-escuro: #A19889; --ouro: #C6BBAE; --ouro-claro: #EFE9DC; --branco: #F7F6F2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    position: relative; color: var(--branco);
    font-family: "Inter Tight", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 60% at 108% 86%, rgba(98, 66, 212, .74) 0%, rgba(60, 44, 150, .38) 34%, rgba(14, 13, 21, 0) 66%),
      radial-gradient(70% 46% at 104% 100%, rgba(40, 118, 150, .50) 0%, rgba(14, 13, 21, 0) 70%),
      radial-gradient(90% 52% at -12% 36%, rgba(34, 44, 120, .66) 0%, rgba(14, 13, 21, 0) 68%),
      linear-gradient(180deg, #0F0E16 0%, #0E0D15 46%, #0D1024 100%);
  }
  .grao { position: absolute; inset: 0; opacity: .05; mix-blend-mode: overlay; pointer-events: none; }
  .quadro { position: absolute; inset: 0; padding: 70px 78px 64px; display: flex; flex-direction: column; align-items: center; }
  .topo, .rodape {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    font-family: "Montserrat", sans-serif; font-weight: 500;
    font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: rgba(247, 246, 242, .82);
  }
  .topo svg { width: 46px; height: 46px; }
  .rodape .seta { font-size: 30px; letter-spacing: 0; color: var(--branco); }
  .miolo { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  .ouro {
    background: linear-gradient(100deg, var(--ouro-escuro) 0%, var(--ouro-claro) 34%, var(--ouro) 58%, var(--ouro-claro) 82%, var(--ouro-escuro) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-family: "Montserrat", sans-serif; text-transform: uppercase; font-size: 84px; line-height: 1.04; }
  h1 .a { display: block; font-weight: 800; letter-spacing: -.012em; }
  h1 .b { display: block; font-weight: 400; letter-spacing: -.005em; color: var(--branco); margin-top: 10px; }
  .final h1 { font-size: 66px; }
  .ponte { margin-top: 44px; max-width: 800px; font-size: 40px; line-height: 1.28; color: rgba(247, 246, 242, .92); text-wrap: balance; }
  .ponte b { font-weight: 700; color: var(--ouro-claro); }

  .icone { width: 150px; height: 150px; }
  .num { margin-top: 34px; font-family: "Montserrat", sans-serif; font-weight: 500; font-size: 24px; letter-spacing: .22em; text-transform: uppercase; color: rgba(247, 246, 242, .78); }
  h2 { margin-top: 14px; font-family: "Inter Tight", sans-serif; font-weight: 700; text-transform: uppercase; font-size: 70px; line-height: 1.02; letter-spacing: -.02em; text-wrap: balance; }
  .fio { width: 220px; height: 2px; margin: 34px 0 36px; background: rgba(247, 246, 242, .75); }
  .texto { max-width: 820px; font-size: 42px; line-height: 1.24; font-weight: 500; letter-spacing: -.005em; text-wrap: balance; }
  .texto p + p { margin-top: 26px; }
  .texto b { font-weight: 700; color: var(--ouro-claro); }

  .marca {
    padding: 9px 4px 7px; border-top: 2px solid rgba(247, 246, 242, .85); border-bottom: 2px solid rgba(247, 246, 242, .85);
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: 40px; line-height: 1; letter-spacing: .06em; font-variant: small-caps; color: var(--branco);
  }
  .rodape { margin-top: 30px; }
</style>
</head>
<body>
<svg class="grao" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

<div class="quadro">
  <div class="topo">
    <span>Paola Rosa · Conexão Estelar</span>
    <svg viewBox="0 0 46 46" fill="none" stroke="#F7F6F2" stroke-width="1.6" aria-hidden="true">
      <circle cx="23" cy="23" r="20"/><circle cx="23" cy="23" r="12"/><circle cx="23" cy="23" r="3.2" fill="#F7F6F2" stroke="none"/>
      <path d="M23 3v6M23 37v6M3 23h6M37 23h6M8.9 8.9l4.2 4.2M32.9 32.9l4.2 4.2M37.1 8.9l-4.2 4.2M13.1 32.9l-4.2 4.2"/>
    </svg>
  </div>
  <div class="miolo" id="miolo"></div>
  <div class="marca">Mesa Arcturiana</div>
  <div class="rodape"><span id="conta"></span><span class="seta" id="seta">&#10230;</span><span id="direita"></span></div>
</div>

<script>
  const I = (d) => '<svg class="icone" viewBox="0 0 88 88" fill="none" stroke="#C6BBAE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="44" cy="44" r="41"/>' + d + '</svg>';
  const ICONES = {
    mensagem: I('<path d="M27 31h34a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H45l-9 8v-8h-9a4 4 0 0 1-4-4V35a4 4 0 0 1 4-4z"/><path d="M32 42h24M32 49h13"/>'),
    medida: I('<path d="M22 54a22 22 0 0 1 44 0"/><path d="M44 54l11-15"/><circle cx="44" cy="54" r="2.6" fill="#C6BBAE" stroke="none"/><path d="M22 54h4M62 54h4M44 32v4M28.4 38.4l2.9 2.9M59.6 38.4l-2.9 2.9"/><path d="M34 62h20"/>'),
    equilibrio: I('<path d="M44 26v36M32 62h24"/><path d="M26 34h36"/><path d="M26 34l-6 14h12zM62 34l-6 14h12z"/><circle cx="44" cy="26" r="2.6" fill="#C6BBAE" stroke="none"/>'),
    raiz: I('<path d="M44 23l18.2 10.5v21L44 65 25.8 54.5v-21z"/><path d="M44 23v42M25.8 33.5l36.4 21M62.2 33.5l-36.4 21"/><circle cx="44" cy="44" r="6.5"/>'),
    audio: I('<path d="M26 44v0M32 38v12M38 31v26M44 36v16M50 27v34M56 37v14M62 41v6"/>'),
    cartas: I('<rect x="27" y="29" width="22" height="32" rx="3" transform="rotate(-10 38 45)"/><rect x="41" y="28" width="22" height="32" rx="3" transform="rotate(9 52 44)"/><path d="M52 39l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5-3.7-3.4 5-.6z"/>')
  };
  const SLIDES = [
    { capa: true, a: "A Mesa<br>Arcturiana", b: "do começo<br>ao fim",
      ponte: "O que acontece desde a sua mensagem até o jogo. <b>Seis passos</b>, um por tela.", direita: "arrasta para o lado" },
    { icone: "mensagem", titulo: "Você me escreve",
      texto: ["<b>As questões que você quer tratar.</b>", "Junto, uma foto recente, o seu nome e a sua data de nascimento. A mesa é à distância: você não precisa estar presente."] },
    { icone: "medida", titulo: "Eu meço",
      texto: ["Antes de tratar.", "A sua aura, <b>em número</b>: o quanto está aberta, o tamanho, a cor de base. E os seus 7 chakras, um por um."] },
    { icone: "equilibrio", titulo: "Eu equilibro",
      texto: ["A aura e os chakras, com as <b>geometrias arcturianas</b>.", "Só depois eu vou para as questões que você trouxe."] },
    { icone: "raiz", titulo: "Eu vou na raiz de cada questão",
      texto: ["Procuro onde ela está alojada e a que outras vivências da sua alma ela ainda está ligada.", "O que ainda está em dor, <b>eu equalizo</b>."] },
    { icone: "audio", titulo: "Você recebe a devolutiva",
      texto: ["<b>Em áudio:</b> os números da sua aura e dos seus chakras, a situação que apareceu em cada questão e os códigos que eu usei.", "Chega em até 3 dias úteis, por ordem de pagamento."] },
    { icone: "cartas", titulo: "A gente joga",
      texto: ["Na semana seguinte, um jogo completo de <b>baralho cigano</b>, ao vivo, numa chamada de 1 hora.", "A mesa faz a parte dela. O jogo mostra o que fazer, e fazer é a sua parte."] },
    { final: true, a: "Me chama<br>no link da bio", b: "e me conta<br>as suas questões",
      ponte: "Eu te explico o atendimento e te passo o valor. <b>Atendo duas mesas por dia</b>, de segunda a sábado.", direita: "link na bio" }
  ];
  const n = Math.min(SLIDES.length, Math.max(1, parseInt(new URLSearchParams(location.search).get("s") || "1", 10)));
  const s = SLIDES[n - 1];
  const m = document.getElementById("miolo");
  if (s.capa || s.final) {
    if (s.final) document.body.classList.add("final");
    m.innerHTML = '<h1><span class="a ouro">' + s.a + '</span><span class="b">' + s.b + '</span></h1><p class="ponte">' + s.ponte + '</p>';
  } else {
    m.innerHTML = ICONES[s.icone] + '<div class="num">Passo ' + (n - 1) + ' de 6</div><h2 class="ouro">' + s.titulo + '</h2><div class="fio"></div><div class="texto">' + s.texto.map(t => "<p>" + t + "</p>").join("") + '</div>';
  }
  document.getElementById("conta").textContent = n + " de " + SLIDES.length;
  document.getElementById("direita").textContent = s.direita || (n < SLIDES.length ? "arrasta" : "");
  if (s.final) document.getElementById("seta").style.visibility = "hidden";
</script>
</body>
</html>
