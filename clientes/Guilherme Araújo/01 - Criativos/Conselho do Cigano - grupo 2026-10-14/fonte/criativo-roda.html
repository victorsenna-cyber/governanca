<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conselho do Cigano · linha roda · v1</title>
<!-- Uso: criativo-roda.html?f=feed|story  ·  feed = 1080x1350, story = 1080x1920
     Modelo de estrutura: 960-referências criativos / "WhatsApp Image 2026-10-14 at 19.43.07 (7).jpeg" (N08)
     (fundo escuro com brilho laranja, marca e sobrelinha, título branco pesado com o fim em laranja,
     roda segmentada com número grande no centro, objeto inclinado à direita, parágrafo com destaque, botão laranja).
     A roda dos 7 passos vira a roda dos 12 signos, com um tom por elemento; o livro vira uma carta. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Montserrat:wght@500;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; color: #fff; text-align: center;
    background:
      radial-gradient(55% 26% at 50% 56%, rgba(255, 120, 20, .28) 0%, rgba(255,120,20,0) 70%),
      radial-gradient(80% 30% at 50% 66%, rgba(255, 90, 10, .16) 0%, rgba(255,90,10,0) 75%),
      #131313;
  }
  .quadro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 70px; }
  .story .quadro { padding: 230px 70px 330px; }

  .marca { display: flex; align-items: center; gap: 14px; }
  .marca svg { width: 52px; height: 52px; }
  .marca span { font-family: "Montserrat", sans-serif; font-weight: 600; font-size: 34px; letter-spacing: .06em; text-transform: uppercase; line-height: 1; text-align: left; }
  .marca span small { display: block; font-size: 22px; color: #FF8A1F; letter-spacing: .1em; margin-top: 4px; }
  .sobre { margin-top: 16px; font-family: "Montserrat", sans-serif; font-weight: 500; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.9); }

  h1 { margin-top: 22px; font-weight: 900; font-size: 98px; line-height: 1.02; letter-spacing: -.045em; }
  h1 em { font-style: normal; color: #FF8A1F; }

  .meio { position: relative; margin-top: 36px; width: 940px; height: 660px; }
  .roda { position: absolute; left: 110px; top: 0; width: 660px; height: 660px; }
  .carta { position: absolute; right: 0; top: 300px; width: 196px; height: 300px; transform: rotate(8deg); }

  .texto { margin-top: 10px; align-self: flex-start; max-width: 720px; text-align: left; font-size: 33px; line-height: 1.3; color: rgba(255,255,255,.92); }
  .texto b { color: #FF8A1F; font-weight: 700; white-space: nowrap; }
  .botao { margin-top: 34px; height: 94px; padding: 0 60px; border-radius: 47px; background: linear-gradient(180deg, #FF9A2E, #F27613); color: #1A0E04; display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 34px; letter-spacing: -.02em; box-shadow: 0 10px 30px rgba(255,120,20,.3); }

  .feed h1 { font-size: 80px; margin-top: 14px; }
  .feed .marca svg { width: 44px; height: 44px; }
  .feed .marca span { font-size: 30px; }
  .feed .sobre { font-size: 20px; margin-top: 12px; }
  .feed .meio { margin-top: 20px; width: 860px; height: 500px; }
  .feed .roda { left: 150px; width: 500px; height: 500px; }
  .feed .carta { top: 220px; width: 160px; height: 245px; }
  .feed .texto { font-size: 29px; max-width: 700px; }
  .feed .botao { margin-top: 24px; height: 84px; font-size: 30px; }
</style>
</head>
<body>
<div class="quadro">
  <div class="marca">
    <svg viewBox="0 0 46 46" fill="none" stroke="#FF8A1F" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M23 2l4.6 11.9L39.3 8.7l-5.2 11.7L46 23l-11.9 4.6 5.2 11.7-11.7-5.2L23 44l-4.6-11.9-11.7 5.2 5.2-11.7L0 23l11.9-4.6L6.7 8.7l11.7 5.2z" transform="translate(1.5 1.5) scale(.935)"/>
      <circle cx="23" cy="23" r="4.2"/>
    </svg>
    <span>Conselho<small>do Cigano</small></span>
  </div>
  <div class="sobre">Tarô e Baralho Cigano · gratuito em outubro</div>
  <h1>Leve o seu signo<br>da previsão<br><em>para as vendas.</em></h1>

  <div class="meio">
    <svg class="roda" id="roda" viewBox="-330 -330 660 660" aria-hidden="true"></svg>
    <svg class="carta" viewBox="0 0 196 300" aria-hidden="true">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A2E"/><stop offset="1" stop-color="#C8460C"/></linearGradient></defs>
      <rect x="2" y="2" width="192" height="296" rx="14" fill="url(#cg)" stroke="#FFD08A" stroke-width="3"/>
      <rect x="16" y="16" width="164" height="268" rx="8" fill="none" stroke="#FFE2B5" stroke-width="2" opacity=".8"/>
      <g transform="translate(98 150)" fill="none" stroke="#FFF3DE" stroke-width="3" stroke-linejoin="round">
        <path d="M0-52l10.4 26.9L36.8-36.8l-11.8 26.4L52 0l-26.9 10.4L36.8 36.8 10.4 25 0 52l-10.4-26.9-26.4 11.7L-25 10.4-52 0l26.9-10.4L-36.8-36.8l26.4 11.8z"/>
        <circle r="10"/>
      </g>
      <text x="98" y="262" text-anchor="middle" font-family="Montserrat" font-weight="600" font-size="15" letter-spacing="2" fill="#FFF3DE">O CIGANO</text>
    </svg>
  </div>

  <p class="texto">Um conselho em vídeo para o seu signo, com <b>o que fazer naquela semana</b> em vendas, clientes e dinheiro. Não é previsão.</p>
  <div class="botao">Responda o quiz e entre no grupo gratuito <span>&rarr;</span></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.body.classList.add(q.get("f") === "story" ? "story" : "feed");
  // 12 signos na ordem do zodíaco; o elemento define o tom
  const SIGNOS = [["Áries","fogo"],["Touro","terra"],["Gêmeos","ar"],["Câncer","agua"],["Leão","fogo"],["Virgem","terra"],
                  ["Libra","ar"],["Escorpião","agua"],["Sagitário","fogo"],["Capricórnio","terra"],["Aquário","ar"],["Peixes","agua"]];
  const COR = { fogo: ["#FF6A1F","#E0480C"], terra: ["#B85A16","#8E3F0B"], ar: ["#FFC15C","#F29A2E"], agua: ["#F28A2A","#C9601A"] };
  const R1 = 300, R0 = 190, GAP = 1.6;
  const svg = document.getElementById("roda"), NS = "http://www.w3.org/2000/svg";
  let defs = `<defs><filter id="br"><feGaussianBlur stdDeviation="14"/></filter></defs>
              <circle r="${R1+12}" fill="none" stroke="#FF7A1A" stroke-width="3" opacity=".55" filter="url(#br)"/>`;
  const p = (r, a) => [r * Math.sin(a * Math.PI / 180), -r * Math.cos(a * Math.PI / 180)].map(v => v.toFixed(2)).join(" ");
  let html = defs;
  SIGNOS.forEach(([nome, el], i) => {
    const a0 = i * 30 - 15 + GAP, a1 = i * 30 + 15 - GAP, [c0, c1] = COR[el];
    html += `<linearGradient id="g${i}" gradientUnits="userSpaceOnUse" x1="${p(R1,a0).split(" ")[0]}" y1="${p(R1,a0).split(" ")[1]}" x2="${p(R0,a1).split(" ")[0]}" y2="${p(R0,a1).split(" ")[1]}"><stop offset="0" stop-color="${c0}"/><stop offset="1" stop-color="${c1}"/></linearGradient>`;
    html += `<path d="M ${p(R1,a0)} A ${R1} ${R1} 0 0 1 ${p(R1,a1)} L ${p(R0,a1)} A ${R0} ${R0} 0 0 0 ${p(R0,a0)} Z" fill="url(#g${i})"/>`;
    const [x, y] = p((R1 + R0) / 2, i * 30).split(" ").map(Number);
    const fs = nome.length > 9 ? 19 : 22;
    html += `<text x="${x}" y="${y + 7}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="${fs}" fill="${el === "ar" ? "#3A1A04" : "#FFFFFF"}">${nome}</text>`;
  });
  html += `<circle r="${R0 - 14}" fill="#141210"/>`;
  html += `<text y="34" text-anchor="middle" font-family="Inter" font-weight="900" font-size="150" fill="#FFFFFF" letter-spacing="-6">12</text>`;
  html += `<text y="96" text-anchor="middle" font-family="Inter" font-weight="800" font-size="44" fill="#FF8A1F">signos</text>`;
  svg.innerHTML = html;
</script>
</body>
</html>
