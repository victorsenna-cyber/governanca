<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conselho do Cigano · linha moldura · v2</title>
<!-- Uso: criativo-moldura.html?c=terapeuta|mentora|cartomante&f=feed|story  ·  feed = 1080x1350, story = 1080x1920
     Modelo de estrutura: 960-referências criativos / "WhatsApp Image 2026-10-12 at 16.01.24.jpeg" (R12)
     (branco com moldura fina, vocativo vermelho grande, título preto e vermelho, corpo leve com uma linha vermelha,
     divisória, reversão de risco com fecho vermelho, botão em pílula preta).
     Medido por pixel na referência: vermelho #D10E12 · divisória #D9D9D9 · moldura a 4% das bordas · conteúdo de 18% a 82%.
     Vermelho trocado pelo da marca do Guilherme (#EC1129, quizzes), escurecido para #DA0F22 para manter o contraste da referência.
     Variação = abertura segmentada (METODO-TRAFEGO-PAGO §4.1): o mesmo corpo, três vocativos. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=block" rel="stylesheet">
<style>
  :root { --vermelho: #DA0F22; --preto: #0A0A0A; --moldura: #2A2A2A; --divisoria: #D9D9D9; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    position: relative; background: #FFFFFF; color: var(--preto);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-align: center;
  }
  .moldura { position: absolute; left: 42px; right: 42px; top: 38px; bottom: 38px; border: 3px solid var(--moldura); }
  .quadro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .story .quadro { padding: 0 0 20px; }

  .voc { font-weight: 800; font-size: 122px; line-height: 1; letter-spacing: -.035em; color: var(--vermelho); }
  h1 { margin-top: 18px; font-weight: 800; font-size: 80px; line-height: 1.12; letter-spacing: -.03em; }
  h1 em { font-style: normal; color: var(--vermelho); }

  .corpo { margin-top: 62px; font-weight: 500; font-size: 48px; line-height: 1.3; letter-spacing: -.018em; }
  .corpo b { display: block; font-weight: 800; font-size: 58px; line-height: 1.22; letter-spacing: -.025em; color: var(--vermelho); }

  .divisoria { width: 718px; height: 2px; background: var(--divisoria); margin: 56px 0 58px; }

  .risco { font-weight: 500; font-size: 48px; line-height: 1.3; letter-spacing: -.018em; }
  .risco b { display: block; font-weight: 800; color: var(--vermelho); letter-spacing: -.022em; }

  .botao {
    margin-top: 62px; padding: 0 54px; height: 122px; border-radius: 61px; background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 36px; letter-spacing: .005em; text-transform: uppercase;
  }

  /* feed 4:5: mesma estrutura, escala menor */
  .feed .voc { font-size: 106px; }
  .feed h1 { margin-top: 12px; font-size: 68px; }
  .feed .corpo { margin-top: 40px; font-size: 41px; }
  .feed .corpo b { font-size: 50px; }
  .feed .divisoria { width: 640px; margin: 38px 0 38px; }
  .feed .risco { font-size: 41px; }
  .feed .botao { margin-top: 42px; padding: 0 46px; height: 104px; font-size: 31px; }
</style>
</head>
<body>
<div class="moldura"></div>
<div class="quadro">
  <div class="voc" id="voc"></div>
  <h1>e se outubro fosse<br>o mês de <em>romper</em><br><em>seu teto financeiro?</em></h1>
  <p class="corpo">um vídeo para o seu signo com<b>o que fazer naquela semana</b>em vendas, clientes e dinheiro,<br>usando Tarô e Baralho Cigano.</p>
  <div class="divisoria"></div>
  <p class="risco">Não é previsão. E durante outubro,<b>o grupo é gratuito.</b></p>
  <div class="botao">Responda o quiz e entre no grupo</div>
</div>
<script>
  const VOC = { terapeuta: "Terapeuta,", mentora: "Mentora,", cartomante: "Cartomante," };
  const q = new URLSearchParams(location.search);
  document.body.classList.add(q.get("f") === "story" ? "story" : "feed");
  document.getElementById("voc").textContent = VOC[q.get("c")] || VOC.terapeuta;
</script>
</body>
</html>
